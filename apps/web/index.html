<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <title>Vexer Agent</title>
    <style>
      /* Boot splash: holds the Vexer mark and name until the client mounts. */
      #vexer-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0a0507;
        color: #f3e6e7;
        font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 260ms ease;
      }
      #vexer-splash.vexer-splash--out {
        opacity: 0;
        pointer-events: none;
      }
      #vexer-splash .vexer-splash__mark {
        width: 84px;
        height: 84px;
        animation: vexer-pulse 1.8s ease-in-out infinite;
      }
      #vexer-splash .vexer-splash__name {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        background: linear-gradient(120deg, #ff4d4d 0%, #d61122 45%, #4a0509 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #vexer-splash .vexer-splash__bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      #vexer-splash .vexer-splash__bar::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #ff4d4d, #d61122);
        animation: vexer-slide 1.25s ease-in-out infinite;
      }
      @keyframes vexer-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.86; }
      }
      @keyframes vexer-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #vexer-splash .vexer-splash__mark,
        #vexer-splash .vexer-splash__bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="vexer-splash" role="status" aria-label="Vexer Agent is starting">
      <svg class="vexer-splash__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="vexer-splash-gradient" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff4d4d" />
            <stop offset="0.45" stop-color="#d61122" />
            <stop offset="1" stop-color="#4a0509" />
          </linearGradient>
        </defs>
        <path d="M22.5 36C17 33 11 29 7.5 23C5.5 19 4.5 14.5 4.8 10L5.6 4.2L12.2 7.5C12.4 12 12.2 17 13.6 21.5C15.4 27 18.6 31.5 24 33.5Z" fill="url(#vexer-splash-gradient)"/>
        <path d="M22.5 36C17 33 11 29 7.5 23C5.5 19 4.5 14.5 4.8 10L5.6 4.2L12.2 7.5C12.4 12 12.2 17 13.6 21.5C15.4 27 18.6 31.5 24 33.5Z" fill="url(#vexer-splash-gradient)" transform="translate(64 0) scale(-1 1)"/>
        <path d="M32 23L24.5 24.5L18 28.5L14.5 35L16 42L21 48.5L25 54L32 57.5L39 54L43 48.5L48 42L49.5 35L46 28.5L39.5 24.5Z" fill="url(#vexer-splash-horn)"/>
        <path d="M32 23L25 25.5L21 32.5L32 36L43 32.5L39 25.5Z" fill="url(#vexer-splash-horn)" opacity=".9"/>
        <path d="M32 41L26 44.5L26.5 53L32 57L37.5 53L38 44.5Z" fill="#0B0B0D" opacity=".6"/>
        <path d="M20 35L27 33L27.6 36.8L21 38.6Z" fill="#FF1728"/>
        <path d="M20 35L27 33L27.6 36.8L21 38.6Z" fill="#FF1728" transform="translate(64 0) scale(-1 1)"/>
        <path d="M28.2 46.5L30.9 45.8L30.9 48.4L28.4 49Z" fill="#5A0008"/>
        <path d="M28.2 46.5L30.9 45.8L30.9 48.4L28.4 49Z" fill="#5A0008" transform="translate(64 0) scale(-1 1)"/>
      </svg>
      <div class="vexer-splash__name">VEXER AGENT</div>
      <div class="vexer-splash__bar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

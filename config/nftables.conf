#!/usr/sbin/nft -f
# Vexer Agent firewall rules.
# The agent's own services stay reachable; everything else is dropped.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iif "lo" accept
    ct state established,related accept
    ip protocol icmp accept

    # ssh, http, https, the agent UI, and the memory tiers
    tcp dport { 22, 80, 443, 7090, 8123, 9000 } accept
    tcp dport { 9092, 7077, 8080, 8081 } accept

    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
